# Builds the QuickDoc Windows installer (.msi/.exe) on every push to main and
# every PR, using a GitHub-hosted Windows runner.
#
# Releases are fully automatic: on a push to main, the next version is derived
# from conventional commits since the last v* tag (feat -> minor, fix/perf ->
# patch, ! or BREAKING CHANGE -> major). When there is something to release,
# the workflow bumps the version files, tags vX.Y.Z, builds, and publishes a
# GitHub Release with the installers attached — all in the same run.
# Pushing a v* tag manually releases that exact tag instead.
#
# This avoids needing to build/run the Tauri GUI inside WSL.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch to save CI minutes — but keep each
# event type in its own group so a pull_request run never cancels the push@main
# run (we always want main artifacts/releases).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Full history + tags: needed to find the last release tag and the
      # commits since it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      # Caches the src-tauri/target dir so subsequent builds are minutes, not ~15.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # Tag-push events release that exact tag. On pushes to main, derive the
      # next version from conventional commits since the last v* tag: when
      # there is a feat/fix/perf (or breaking change), bump the version files,
      # commit "chore(release): vX.Y.Z [skip ci]", tag it, and push. Otherwise
      # (docs/ci/chore-only changes) no release is made and TAG stays empty.
      - name: Resolve release version
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          TAG=""
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG="${REF#refs/tags/}"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/main ]] || [[ "$EVENT" == workflow_dispatch ]]; then
            LAST_TAG=$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi

            MAJOR=0; MINOR=0; PATCH=0
            while IFS= read -r s; do
              [ -z "$s" ] && continue
              case "$s" in
                feat*) if [[ "$s" == *"!"* ]]; then MAJOR=$((MAJOR+1)); else MINOR=$((MINOR+1)); fi;;
                fix*|perf*) if [[ "$s" == *"!"* ]]; then MAJOR=$((MAJOR+1)); else PATCH=$((PATCH+1)); fi;;
              esac
            done <<EOF
          $(git log "$RANGE" --format='%s')
          EOF
            if [ "$(git log "$RANGE" --format='%b' | grep -c 'BREAKING CHANGE' || true)" -gt 0 ]; then
              MAJOR=$((MAJOR+1))
            fi

            CUR=$(node -p "require('./package.json').version")
            NEXT=$(node -e "let [x,y,z]=process.argv[1].split('.').map(Number); if($MAJOR)x++; else if($MINOR)y++; else z++; console.log([x,y,z].join('.'))" "$CUR")

            if [ "$NEXT" = "$CUR" ] && git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
              echo "No releasable commits since $LAST_TAG; skipping release."
            else
              node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.argv[1];fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")' "$NEXT"
              node -e 'const fs=require("fs");const l=JSON.parse(fs.readFileSync("package-lock.json","utf8"));l.version=process.argv[1];l.packages[""].version=process.argv[1];fs.writeFileSync("package-lock.json",JSON.stringify(l,null,2)+"\n")' "$NEXT"
              node -e 'const fs=require("fs");const t=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json","utf8"));t.version=process.argv[1];fs.writeFileSync("src-tauri/tauri.conf.json",JSON.stringify(t,null,2)+"\n")' "$NEXT"
              sed -i "s/^version = \".*\"/version = \"$NEXT\"/" src-tauri/Cargo.toml
              node -e 'const fs=require("fs");let s=fs.readFileSync("src-tauri/Cargo.lock","utf8");s=s.replace(/name = "quickdoc"\nversion = "[^"]+"/,`name = "quickdoc"\nversion = "${process.argv[1]}"`);fs.writeFileSync("src-tauri/Cargo.lock",s)' "$NEXT"

              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
              git commit -m "chore(release): v$NEXT [skip ci]"
              git tag "v$NEXT"
              git push origin HEAD "refs/tags/v$NEXT"

              TAG="v$NEXT"
              {
                echo "body<<BODY_EOF"
                if [ -n "$LAST_TAG" ]; then
                  git log "$LAST_TAG..HEAD^" --format='- %s (%h)'
                else
                  git log --format='- %s (%h)'
                fi
                echo "BODY_EOF"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Builds the frontend (vite) + the Rust binary + the Windows installer.
      # When TAG is set it publishes/updates the GitHub Release and attaches
      # the raw installers; otherwise it only builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "QuickDoc ${{ steps.release.outputs.tag }}"
          releaseBody: ${{ steps.release.outputs.body }}
          releaseDraft: false
          prerelease: false

      # Installers as raw (unzipped) artifacts on every run — one artifact per
      # file, named after the file itself (archive:false ignores `name`).
      - name: Upload MSI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/msi/*.msi
          archive: false
          if-no-files-found: warn

      - name: Upload NSIS installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          path: src-tauri/target/release/bundle/nsis/*.exe
          archive: false
          if-no-files-found: warn
