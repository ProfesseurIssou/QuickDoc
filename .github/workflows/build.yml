# Builds the QuickDoc Windows installer (.msi/.exe) on every push to main and
# every PR, using a GitHub-hosted Windows runner. On a vX.Y.Z tag it also
# publishes a (draft) GitHub Release with the installer attached.
#
# This avoids needing to build/run the Tauri GUI inside WSL.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch to save CI minutes — but keep each
# event type in its own group so a pull_request run never cancels the push@main
# run (we always want main artifacts/releases).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      # Caches the src-tauri/target dir so subsequent builds are minutes, not ~15.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Builds the frontend (vite) + the Rust binary + the Windows installer.
      # On a tag push it also creates a published GitHub Release with the raw
      # installer attached (no zip). On other events it just builds.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on non-tag runs → no release is created.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "QuickDoc ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

      # Always expose the built installers as downloadable artifacts, even on
      # plain pushes/PRs. upload-artifact always wraps files in a zip on
      # download; the unzipped installers live on the tag releases instead.
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuickDoc_${{ steps.version.outputs.version }}_windows_x64
          path: |
            src-tauri/target/release/bundle/msi/**/*.msi
            src-tauri/target/release/bundle/nsis/**/*.exe
          if-no-files-found: warn
